name: rovergo_captain
description: "RoverGo Captain App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.3
  google_maps_flutter: ^2.14.0
  geolocator: ^11.1.0
  audioplayers: ^6.5.1
  flutter_secure_storage: ^9.2.4
  video_player: ^2.7.2

  # Background tracker (lightweight) — replace with the tracker you prefer
  background_location_tracker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.mp3
    - assets/splash.mp4
    - assets/car.png
    - assets/bike.png
